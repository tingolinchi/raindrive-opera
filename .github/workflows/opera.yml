name: Lluvia de Europa (OPERA)

on:
  schedule:
    - cron: "*/15 * * * *"   # respaldo; el disparador de Cloudflare (opera-trigger) lanza el workflow cada 5 min
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["build_opera.py", "opera_core.py", ".github/workflows/opera.yml"]

permissions:
  contents: write   # solo para el latido mensual
  pages: write
  id-token: write

concurrency:
  group: opera
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas
        run: python -m unittest -v test_opera test_build_opera
      # La carpeta out se conserva entre ejecuciones para no volver a bajar ni convertir los fotogramas ya hechos.
      - name: Restaurar fotogramas anteriores
        uses: actions/cache/restore@v4
        with:
          path: out
          key: opera-out-${{ github.run_id }}
          restore-keys: opera-out-
      - name: Generar teselas
        run: python build_opera.py out
      - name: Guardar fotogramas
        uses: actions/cache/save@v4
        with:
          path: out
          key: opera-out-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Latido (evita que GitHub desactive el workflow por inactividad a los 60 días)
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((30*24*3600)) ]; then
            git config user.name "opera-bot"
            git config user.email "opera-bot@users.noreply.github.com"
            git commit --allow-empty -m "latido"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
